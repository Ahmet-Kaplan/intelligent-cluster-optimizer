[project]
name = "cgate"
version = "0.1.0"
description = "Offline trace-driven evaluation of conformal safety gates for vertical autoscaling"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=15", "hydra-core>=1.3", "lightgbm>=4.3"]

[project.optional-dependencies]
gpu = ["chronos-forecasting>=2.0", "torch>=2.7"]
toto = ["toto-2>=2.0", "torch>=2.7"]
timesfm = ["timesfm[torch]>=3.0", "torch>=2.7"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgate"]

[tool.ruff]
line-length = 120

data:
  alibaba_path: data/alibaba/container_usage.csv   # "-" = read from stdin (streamed)
  keep_frac: 0.05          # deterministic container subsample; RAM ~ keep_frac x 6.5 GB
  chunksize: 5000000
  step_s: 60
selection:
  min_days: 3.0
  max_nan_frac: 0.05
  per_stratum: 100
  seed: 42
injection:
  leak_prevalence: 0.1     # also run 0.5 (plan §3)
  leak_rates: [0.005, 0.02, 0.05, 0.2]   # fraction of baseline memory per hour
  negative_frac: 0.3       # share of healthy containers given a hard negative
  seeds: [0, 1, 2, 3, 4]
out_dir: outputs/prepared
